# Red de seguridad: cada push a main y cada pull request corre el chequeo de
# tipos y TODAS las pruebas (incluidas las guardas de arquitectura de
# app/lib/arquitectura.test.ts). Si algo falla, GitHub lo marca en rojo.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chequeo de tipos
        run: npx tsc --noEmit
      - name: Pruebas
        run: npm test
